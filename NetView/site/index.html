<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Document and explore the devices, links, VLANs, and routes in your network.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1316">
  <title>NetView · Network Topology</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#topology"><span class="brand-mark" data-icon="brand"></span><span>NetView</span></a>
    <div class="sidebar-workspace">
      <button class="workspace-select" type="button" data-action="workspace">
        <span class="workspace-icon" data-icon="workspace"></span>
        <span class="workspace-text"><strong id="workspace-name">Workspace</strong><small>Browser storage</small></span>
        <span data-icon="chevrons" class="workspace-chevron"></span>
      </button>
    </div>
    <nav class="navigation" aria-label="Workspace">
      <div class="nav-group"><p>NETWORK</p>
        <a class="nav-item" href="#topology" data-page="topology"><span data-icon="topology"></span>Topology</a>
        <a class="nav-item" href="#devices" data-page="devices"><span data-icon="device"></span>Devices</a>
        <a class="nav-item" href="#links" data-page="links"><span data-icon="link"></span>Connections</a>
      </div>
      <div class="nav-group"><p>ADDRESSING</p>
        <a class="nav-item" href="#vlans" data-page="vlans"><span data-icon="layers"></span>VLANs</a>
        <a class="nav-item" href="#prefixes" data-page="prefixes"><span data-icon="grid"></span>IP Prefixes</a>
        <a class="nav-item" href="#routes" data-page="routes"><span data-icon="route"></span>Routes</a>
      </div>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item settings-link" type="button" data-action="workspace"><span data-icon="settings"></span>Workspace settings</button>
      <div class="local-status"><span class="local-dot" id="local-dot"></span><span id="save-status">Connecting…</span></div>
    </div>
  </aside>

  <div class="application">
    <header class="topbar">
      <div class="breadcrumbs"><button class="icon-button mobile-toggle" type="button" data-action="menu" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false" data-icon="menu"></button><span class="crumb-root">Workspace</span><span class="crumb-divider" data-icon="chevron"></span><strong id="breadcrumb">Topology</strong></div>
      <button type="button" class="search-trigger" data-action="search"><span data-icon="search"></span><span>Search workspace</span><kbd>Ctrl K</kbd></button>
    </header>
    <main id="main" aria-busy="true">
      <div class="loading">Loading workspace…</div>
    </main>
  </div>

  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
